# BEGIN_KITTY_THEME
# Rosé Pine
# include kitty-theme.conf
# END_KITTY_THEME
window_padding_width 7
# font_size 12
confirm_os_window_close 0

remember_window_size  no
initial_window_width  640
initial_window_height 400

# =========================================
# KITTY — TOKYO NIGHT
# =========================================

# Fonte
font_family      SpaceMono Nerd Font
bold_font        SpaceMono Nerd Font
italic_font      SpaceMono Nerd Font
bold_italic_font SpaceMono Nerd Font
font_size 12.5

# Cursor
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_color #7aa2f7
cursor_text_color #16161e

# Cores
foreground #c0caf5
background #16161e

selection_foreground #16161e
selection_background #7aa2f7

# Tokyo Night
color0  #16161e
color1  #f7768e
color2  #73daca
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5

color8  #565f89
color9  #f7768e
color10 #73daca
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #a9b1d6

# Transparência
background_opacity 0.90

# Espaçamento
window_padding_width 12
window_padding_height 10

# Sem borda
hide_window_decorations yes

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select no
strip_trailing_spaces smart

