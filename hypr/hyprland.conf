# ============================================================
# HYPRLAND - THINKPAD T14 GEN 1
# 14" 1920x1080
# Hyprland 0.56.x
# ============================================================


# ------------------------------------------------------------
# MONITOR
# ------------------------------------------------------------

monitor = ,preferred,auto,1


# ------------------------------------------------------------
# PROGRAMAS
# ------------------------------------------------------------

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun


# ------------------------------------------------------------
# AUTOSTART
# ------------------------------------------------------------

exec-once = waybar
exec-once = hyprpaper
exec-once = blueman-applet
exec-once = swaync


# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# ------------------------------------------------------------
# JANELAS
# ------------------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 8

    border_size = 0

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false

    layout = master
}



# ------------------------------------------------------------
# DECORAÇÃO
# ------------------------------------------------------------

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 3
        passes = 2
    }
}


# ------------------------------------------------------------
# ANIMAÇÕES
# ------------------------------------------------------------

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1
    bezier = quick,0.15,0,0.1,1

    animation = global,1,10,default

    animation = windows,1,6,easeOutQuint
    animation = windowsIn,1,5,easeOutQuint,popin
    animation = windowsOut,1,5,easeOutQuint,popin

    animation = border,1,10,default
    animation = fade,1,7,quick

    animation = workspaces,1,6,easeOutQuint
}


# ------------------------------------------------------------
# MASTER
# ------------------------------------------------------------

master {
    new_status = slave
    mfact = 0.50
}

# ------------------------------------------------------------
# DWINDLE
# ------------------------------------------------------------

dwindle {
    preserve_split = true
}


# ------------------------------------------------------------
# INPUT
# ------------------------------------------------------------

input {
    kb_layout = br
    kb_variant = thinkpad
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}


# ------------------------------------------------------------
# GESTOS
# ------------------------------------------------------------

gesture = 3, horizontal, workspace


# ------------------------------------------------------------
# ATALHOS
# ------------------------------------------------------------

$mainMod = SUPER


# Terminal
bind = $mainMod, Q, exec, $terminal

# Fechar janela
bind = $mainMod, C, killactive

# Sair
bind = $mainMod, M, exit

# Arquivos
bind = $mainMod, E, exec, $fileManager

# Flutuar
bind = $mainMod, V, togglefloating

# Launcher
bind = $mainMod, R, exec, $menu

# Pseudo-tile
bind = $mainMod, P, pseudo

# Tela de Bloqueio

bind = $mainMod, L, exec, hyprlock


# ------------------------------------------------------------
# FOCO
# ------------------------------------------------------------

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ------------------------------------------------------------
# MOVER JANELAS
# ------------------------------------------------------------

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


# ------------------------------------------------------------
# WORKSPACES
# ------------------------------------------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# ------------------------------------------------------------
# MOVER JANELA PARA WORKSPACE
# ------------------------------------------------------------

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# ------------------------------------------------------------
# SCROLL ENTRE WORKSPACES
# ------------------------------------------------------------

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# ------------------------------------------------------------
# MOUSE
# ------------------------------------------------------------

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ------------------------------------------------------------
# VOLUME
# ------------------------------------------------------------

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ------------------------------------------------------------
# BRILHO
# ------------------------------------------------------------

bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-


# ------------------------------------------------------------
# MODO DE ENERGIA
# ------------------------------------------------------------

bind = $mainMod, F1, exec, powerprofilesctl set power-saver
bind = $mainMod, F2, exec, powerprofilesctl set balanced
bind = $mainMod, F3, exec, powerprofilesctl set performance

# ------------------------------------------------------------
# MÍDIA
# ------------------------------------------------------------

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


# ------------------------------------------------------------
# SWAYNC
# ------------------------------------------------------------

bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, N, exec, swaync-client -C


# ------------------------------------------------------------
# MISC
# ------------------------------------------------------------

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}
