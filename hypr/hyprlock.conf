# ==============================
# HYPRLOCK — TOKYO NIGHT
# ==============================

background {
    monitor =
    path = ~/.config/Pictures/1.png

    blur_passes = 2
    blur_size = 4

    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Relógio
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(c0caf5ff)
    font_size = 96
    font_family = SpaceMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d de %B')"
    color = rgba(a9b1d6ff)
    font_size = 20
    font_family = SpaceMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Usuário
label {
    monitor =
    text = koller
    color = rgba(7aa2f7ff)
    font_size = 24
    font_family = SpaceMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true

    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(16161eff)
    font_color = rgba(c0caf5ff)

    fade_on_empty = false
    placeholder_text = <i>Senha...</i>

    position = 0, -250
    halign = center
    valign = center
}

# Bateria
label {
    monitor =
    text = cmd[update:5000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(565f89ff)
    font_size = 14
    font_family = SpaceMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

# Host
label {
    monitor =
    text = "ThinkPad T14 Gen 1"
    color = rgba(565f89ff)
    font_size = 14
    font_family = SpaceMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}
